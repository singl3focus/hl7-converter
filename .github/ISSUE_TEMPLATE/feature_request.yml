name: Feature request
description: Propose a new mapping capability, tag option, or API addition.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real-world mapping scenario does this enable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        Concrete shape of the change. If this is an API addition, include
        the proposed function/struct signatures.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds via current config, JS post-processing, or external code.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This stays within row-based message transformation (no orchestration, queues, persistence).
          required: true
