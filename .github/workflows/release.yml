name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup supported release compiler
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - name: Smoke test CLI before packaging
        run: |
          go build -o "$RUNNER_TEMP/hl7conv" ./cmd/hl7conv
          "$RUNNER_TEMP/hl7conv" version
          "$RUNNER_TEMP/hl7conv" convert -h
          "$RUNNER_TEMP/hl7conv" validate-config -config ./examples/mappings/config.json -in input -out output
          "$RUNNER_TEMP/hl7conv" check -fixtures ./examples/mappings/suite.json
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
